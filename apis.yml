name: Grana
description: Grana was a Hong Kong-based direct-to-consumer fashion brand founded in October 2014
  by Luke Grana and Pieter-Paul Wittgen, selling premium wardrobe basics made from directly-sourced
  fabrics — Peruvian pima cotton, Chinese silk, Japanese denim, European linen, cashmere, merino and
  baby alpaca — online without retail middlemen. It raised roughly US$16M across seed and Series A rounds
  from investors including Alibaba's Hong Kong Entrepreneurs Fund, 500 Startups (now 500 Global),
  Golden Gate Ventures, MindWorks Ventures and the Bluebell Group. The company has since wound down;
  grana.com now resolves to a parked domain with no live storefront, developer program, or public API.
